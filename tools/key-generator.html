<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ortak Sınav Yerleşim Sistemi Lisans Anahtarı Üretici</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Noble Ed25519 Kriptografi Kütüphanesi -->
  <script type="module">
    import * as ed from 'https://cdn.jsdelivr.net/npm/@noble/ed25519@2.0.0/+esm';
    
    // Gizli Anahtar (Seed - Sadece sizde olmalı)
    const PRIVATE_KEY_HEX = '89ad8a0a1134f670d048215d7614e863aeda338406a5ca3feb2c395387f2483a';

    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function hexToBytes(hex) {
      return new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
    }

    window.toggleUniversal = function() {
      const isUniversal = document.getElementById('isUniversal').checked;
      const inputs = ['schoolName', 'kurumKodu', 'machineId'];
      
      inputs.forEach(id => {
        const el = document.getElementById(id);
        if (isUniversal) {
          el.disabled = true;
          el.classList.add('bg-gray-100', 'text-gray-400');
        } else {
          el.disabled = false;
          el.classList.remove('bg-gray-100', 'text-gray-400');
        }
      });
    };

    window.generateLicenseKey = async function() {
      try {
        const expiryDate = document.getElementById('expiryDate').value;
        const isUniversal = document.getElementById('isUniversal').checked;
        const schoolName = document.getElementById('schoolName').value.trim();
        const kurumKodu = document.getElementById('kurumKodu').value.trim();
        const machineId = document.getElementById('machineId').value.trim();

        if (!expiryDate) {
          alert("Lütfen bitiş tarihini girin.");
          return;
        }

        const dateCompact = expiryDate.replace(/-/g, '');
        const payload = { e: dateCompact };
        
        if (!isUniversal) {
          if (!schoolName || !kurumKodu || !machineId) {
            alert("Lütfen Okul İsmi, Kurum Kodu ve Makine ID alanlarının tümünü doldurun. Evrensel lisans üretmek istiyorsanız yukarıdaki seçeneği işaretleyin.");
            return;
          }
          payload.n = schoolName;
          payload.k = kurumKodu;
          payload.m = machineId.toUpperCase();
        }

        const json = JSON.stringify(payload);
        const payloadHex = bytesToHex(new TextEncoder().encode(json)).toUpperCase();

        // İmza oluştur (String'in utf-8 byteları üzerinden)
        const messageBytes = new TextEncoder().encode(payloadHex);
        const privateKeyBytes = hexToBytes(PRIVATE_KEY_HEX);
        
        // Noble ed25519 ile imzala
        const signatureBytes = await ed.signAsync(messageBytes, privateKeyBytes);
        const sigHex = bytesToHex(signatureBytes).toUpperCase();

        // Nihai anahtar
        const raw = payloadHex + sigHex;
        const formattedKey = raw.match(/.{1,4}/g).join('-');

        document.getElementById('result').innerText = formattedKey;
        document.getElementById('resultArea').classList.remove('hidden');
      } catch (err) {
        alert("Hata oluştu: " + err.message);
        console.error(err);
      }
    };

    window.copyKey = function() {
      const key = document.getElementById('result').innerText;
      navigator.clipboard.writeText(key).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = "Kopyalandı!";
        btn.classList.replace('bg-blue-600', 'bg-green-600');
        setTimeout(() => {
          btn.innerText = "Kopyala";
          btn.classList.replace('bg-green-600', 'bg-blue-600');
        }, 2000);
      });
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="bg-white rounded-xl shadow-lg max-w-lg w-full overflow-hidden border border-gray-200">
    <div class="bg-indigo-700 p-5 text-white">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <svg class="w-6 h-6 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        Ortak Sınav Yerleşim Sistemi Lisans Anahtarı Üretici
      </h1>
      <p class="text-indigo-200 text-sm mt-1">Ed25519 Eliptik Eğri Kriptografisi</p>
    </div>
    
    <div class="p-6 space-y-4">
      <div class="bg-yellow-50 border-l-4 border-yellow-400 p-3 rounded text-sm text-yellow-800">
        <strong>UYARI:</strong> Bu HTML dosyasını ve içindeki GİZLİ ANAHTARI kimseyle paylaşmayın.
      </div>

      <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100">
        <label class="flex items-center space-x-3 cursor-pointer">
          <input type="checkbox" id="isUniversal" onchange="toggleUniversal()" class="w-5 h-5 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500">
          <span class="text-sm font-bold text-indigo-900">Evrensel Lisans Üret (Tüm cihazlarda geçerli)</span>
        </label>
        <p class="text-xs text-indigo-700 mt-1 ml-8">Seçildiğinde diğer bilgiler (Kurum kodu, makine ID) sorulmaz, tek şifre ile her yerde açılır.</p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Bitiş Tarihi *</label>
        <input type="date" id="expiryDate" class="w-full border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" value="2030-12-31">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Okul İsmi (Zorunlu)</label>
        <input type="text" id="schoolName" class="w-full border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border transition-colors" placeholder="Örn: Çamlıca Anadolu Lisesi">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Kurum Kodu (Zorunlu)</label>
        <input type="text" id="kurumKodu" class="w-full border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border transition-colors" placeholder="Örn: 746839">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Makine ID (Zorunlu)</label>
        <input type="text" id="machineId" class="w-full border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border font-mono text-sm transition-colors" placeholder="Müşteri cihazından alınan kod">
      </div>

      <button onclick="generateLicenseKey()" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-3 px-4 rounded-md shadow transition-colors mt-2">
        GÜVENLİ ANAHTAR ÜRET
      </button>

      <div id="resultArea" class="hidden mt-6 bg-gray-50 rounded-lg p-4 border border-indigo-200 shadow-inner">
        <div class="flex justify-between items-center mb-2">
          <span class="text-sm font-bold text-gray-700">Üretilen Lisans Anahtarı:</span>
          <button id="copyBtn" onclick="copyKey()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-1 px-3 rounded transition-colors">
            Kopyala
          </button>
        </div>
        <div id="result" class="font-mono text-sm text-indigo-900 break-all select-all leading-relaxed tracking-wider bg-white p-3 rounded border border-indigo-100">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
