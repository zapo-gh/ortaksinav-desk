<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1976d2" />
    <meta
      name="description"
      content="Gelişmiş sınav salonu yerleştirme ve planlama sistemi. Öğrenci yerleştirme, salon yönetimi, PDF export ve daha fazlası."
    />
    <meta name="keywords" content="sınav, salon, yerleştirme, planlama, öğrenci, ortak, sınav sistemi, salon planı" />
    <meta name="author" content="Ortak Sınav Yerleşim Programı" />
    <meta name="robots" content="index, follow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://apis.google.com https://api.emailjs.com https://*.emailjs.com http://ipc.localhost; frame-src 'self' https://www.google.com;" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Ortak Sınav Yerleştirme Sistemi</title>
    <style>
      /* Anında görünür loading ekranı - React yüklenmeden önce */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #F8FAFC;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      #root {
        height: 100%;
      }
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #F8FAFC;
        color: #0F172A;
        gap: 1.5rem;
      }
      #preloader .logo {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #4F46E5;
      }
      #preloader .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(79, 70, 229, 0.15);
        border-top-color: #4F46E5;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #preloader .subtitle {
        font-size: 0.9rem;
        font-weight: 500;
        color: #64748B;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Preloader #root DIŞINDA - React bunu silemez -->
    <div id="preloader">
      <div class="logo">Ortak Sınav Yerleşim Programı</div>
      <div class="spinner"></div>
      <div class="subtitle"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
